# 운영(prod) compose.
# 사용 예:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# 마이그레이션:
#   docker compose -f docker-compose.prod.yml --profile migrate run --rm migrate

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sync-up-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 일회성 마이그레이션 잡. 평소엔 뜨지 않고 --profile migrate 로만 실행.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["migrate"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sync-up-network
    command: ["npx", "prisma", "migrate", "deploy"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sync-up-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sync-up-network
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sync-up-frontend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sync-up-network
    ports:
      - "3000:3000"

volumes:
  postgres_data:

networks:
  sync-up-network:
    driver: bridge
