# 운영(prod) compose — docker-rollout 무중단 배포 구성.
#
# 배포는 deploy/deploy.sh 가 docker-rollout(https://github.com/wowu/docker-rollout)으로 합니다.
# rollout 은 서비스 컨테이너를 잠시 2배로 늘려 새 컨테이너가 healthy 가 되면 옛 컨테이너를 지웁니다.
#   ./deploy/deploy.sh <backend 태그> <frontend 태그>   새 버전 배포
#   ./deploy/deploy.sh rollback                         직전 태그로 되돌리기
#   ./deploy/deploy.sh status                           현재 상태
#
# 이미지 태그는 서버의 .deploy.env 에 기록됩니다. compose 를 직접 실행할 때는
#   docker compose -f docker-compose.prod.yml --env-file .env --env-file .deploy.env <명령>
#
# 외부 진입점은 nginx(80) 하나입니다. (deploy/nginx/conf.d/default.conf)
#   /              → frontend 컨테이너들 (Docker DNS 로 매 요청 조회)
#   /backend/*     → backend 컨테이너들
#   /_next/static/ → 공유 볼륨(next_static) 의 정적 파일 (구·신버전 파일을 모두 보관)
#
# docker-rollout 요구 조건: 앱 서비스에 container_name 과 ports 를 두지 않습니다.
# (컨테이너 두 개가 같은 이름·포트를 가질 수 없음. 헬스체크는 Docker 가 합니다)

# 프로젝트 이름을 고정합니다. 기본값(폴더 이름 Sync-up → sync-up)과 같게 두어
# 볼륨 이름(sync-up_postgres_data 등)이 바뀌지 않게 합니다.
name: sync-up

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sync-up-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 일회성 마이그레이션 잡. deploy.sh 가 배포할 backend 이미지로 실행합니다.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/sync-up-project/backend}:${BACKEND_TAG:-main}
    profiles: ["migrate"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sync-up-network
    command: ["npx", "prisma", "migrate", "deploy"]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/sync-up-project/backend}:${BACKEND_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sync-up-network
    # docker-rollout 은 옛 컨테이너를 `docker stop` 으로 멈추며, 이 값만큼 기다립니다.
    # 진행 중인 AI 작업 대기(backend 의 AI_JOB_SHUTDOWN_WAIT_MS 기본 150초)보다 길게 둡니다.
    stop_grace_period: 180s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:3000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 2s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/sync-up-project/frontend}:${FRONTEND_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # backend 서비스 이름. rollout 중에는 구·신 backend 컨테이너가 모두 이 이름으로 조회됩니다.
      - INTERNAL_BACKEND_URL=http://backend:3000
    networks:
      - sync-up-network
    volumes:
      - next_static:/srv/next-static
    # 시작할 때 이 버전의 정적 파일(/_next/static)을 공유 볼륨에 복사한 뒤 서버를 띄웁니다.
    # 파일 이름에 해시가 있어 구·신버전 파일이 섞여도 충돌하지 않습니다.
    command: ["sh", "-c", "cp -R /app/.next/static/. /srv/next-static/ && exec node server.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - sync-up-network
    ports:
      - "80:80"
    volumes:
      # 설정은 파일이 아니라 폴더째 마운트합니다. git pull 로 파일이 교체돼도 reload 만으로 반영됩니다.
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - next_static:/var/www/next-static:ro

volumes:
  postgres_data:
  next_static:

networks:
  sync-up-network:
    driver: bridge
