# 운영(prod) compose — 블루-그린 무중단 배포 구성.
#
# backend·frontend 를 blue / green 두 벌로 정의하고, nginx 가 그중 한 벌(활성 색)로만 트래픽을 보냅니다.
# 배포는 deploy/deploy.sh 가 담당합니다. 직접 up/down 하지 말고 스크립트를 쓰세요.
#   ./deploy/deploy.sh <backend 태그> <frontend 태그>   새 버전 배포
#   ./deploy/deploy.sh rollback                         직전 색으로 되돌리기
#   ./deploy/deploy.sh status                           현재 상태
#
# 이미지 태그와 활성 색은 서버의 .deploy.env 에 기록됩니다. compose 를 직접 실행할 때는
#   docker compose -f docker-compose.prod.yml --env-file .env --env-file .deploy.env <명령>
#
# 외부 진입점은 nginx(80) 하나입니다. (deploy/nginx/conf.d/default.conf)
#   /              → 활성 색 frontend
#   /backend/*     → 활성 색 backend
#   /_next/static/ → 공유 볼륨(next_static) 의 정적 파일 (구·신버전 파일을 모두 보관)
# 앱 컨테이너는 포트를 열지 않습니다. 두 색이 같은 포트를 쓸 수 없고, 헬스체크는 Docker 가 합니다.

# 프로젝트 이름을 고정합니다. 기본값(폴더 이름 Sync-up → sync-up)과 같게 두어
# 볼륨 이름(sync-up_postgres_data 등)이 바뀌지 않게 합니다.
name: sync-up

x-backend: &backend
  restart: unless-stopped
  env_file:
    - .env
  environment:
    - NODE_ENV=production
    - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?schema=public
  depends_on:
    db:
      condition: service_healthy
  networks:
    - sync-up-network
  # 종료 시 진행 중인 AI 작업을 기다립니다. (backend 의 AI_JOB_SHUTDOWN_WAIT_MS 기본 150초보다 길게)
  stop_grace_period: 180s
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:3000/health > /dev/null || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 60s
    start_interval: 2s

x-frontend: &frontend
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - sync-up-network
  volumes:
    - next_static:/srv/next-static
  # 시작할 때 이 버전의 정적 파일(/_next/static)을 공유 볼륨에 복사한 뒤 서버를 띄웁니다.
  # 파일 이름에 해시가 있어 구·신버전 파일이 섞여도 충돌하지 않습니다.
  command: ["sh", "-c", "cp -R /app/.next/static/. /srv/next-static/ && exec node server.js"]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- --tries=1 http://127.0.0.1:3000/ > /dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 60s
    start_interval: 2s

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sync-up-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 일회성 마이그레이션 잡. deploy.sh 가 배포할 backend 이미지로 실행합니다.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/sync-up-project/backend}:${MIGRATE_TAG:-main}
    profiles: ["migrate"]
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sync-up-network
    command: ["npx", "prisma", "migrate", "deploy"]

  backend-blue:
    <<: *backend
    image: ${BACKEND_IMAGE:-ghcr.io/sync-up-project/backend}:${BLUE_BACKEND_TAG:-main}

  backend-green:
    <<: *backend
    image: ${BACKEND_IMAGE:-ghcr.io/sync-up-project/backend}:${GREEN_BACKEND_TAG:-main}

  frontend-blue:
    <<: *frontend
    image: ${FRONTEND_IMAGE:-ghcr.io/sync-up-project/frontend}:${BLUE_FRONTEND_TAG:-main}
    environment:
      - NODE_ENV=production
      # 같은 색 backend 와 짝을 이룹니다. (새 화면이 옛 API 를 부르는 버전 어긋남 방지)
      - INTERNAL_BACKEND_URL=http://backend-blue:3000
    depends_on:
      backend-blue:
        condition: service_healthy

  frontend-green:
    <<: *frontend
    image: ${FRONTEND_IMAGE:-ghcr.io/sync-up-project/frontend}:${GREEN_FRONTEND_TAG:-main}
    environment:
      - NODE_ENV=production
      - INTERNAL_BACKEND_URL=http://backend-green:3000
    depends_on:
      backend-green:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - sync-up-network
    ports:
      - "80:80"
    volumes:
      # 설정은 파일이 아니라 폴더째 마운트합니다. git pull 로 파일이 교체돼도 reload 만으로 반영됩니다.
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # deploy.sh 가 활성 색을 기록하는 upstream.conf. 파일이 아니라 폴더를 마운트해야
      # 파일을 교체(mv)했을 때 컨테이너가 새 내용을 봅니다.
      - ./deploy/nginx/active:/etc/nginx/syncup:ro
      - next_static:/var/www/next-static:ro

volumes:
  postgres_data:
  next_static:

networks:
  sync-up-network:
    driver: bridge
