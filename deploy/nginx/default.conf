# Sync-up 리버스 프록시 (docker-compose.prod.yml 의 nginx 서비스가 사용)
#
#   /           → frontend (Next.js)
#   /backend/*  → backend (NestJS). 앞의 "/backend" 는 떼고 전달합니다.
#                 REST API, GitHub OAuth, 채팅 소켓(/backend/socket.io) 모두 여기로 갑니다.
#
# 브라우저 입장에선 프론트/백엔드가 같은 도메인이라 CORS·쿠키 문제가 생기지 않습니다.
# 프론트가 "/backend" 를 쓰는 이유는 frontend/src/lib/backendUrl.ts 참고.
# (Next.js 자체 API 라우트가 /api 를 쓰고 있어서 /api 대신 /backend 를 사용)
#
# HTTPS 는 이 앞단(ALB, Cloudflare, certbot 등)에서 처리하는 것을 전제로 합니다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /backend/ {
        # 끝의 "/" 때문에 /backend/auth/login → backend:3000/auth/login 으로 전달됩니다.
        proxy_pass http://backend:3000/;

        # socket.io (websocket) 업그레이드
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드 쿠키는 path=/auth, /auth/github 로 발급됩니다.
        # 브라우저가 보는 경로는 /backend/auth/... 이므로 경로를 맞춰 주지 않으면
        # refresh_token 이 전송되지 않아 로그인 유지(토큰 재발급)가 깨집니다.
        proxy_cookie_path /auth /backend/auth;

        # AI 생성 요청은 오래 걸릴 수 있음
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next API 라우트가 AI 생성 요청을 백엔드로 중계하므로 동일하게 여유를 둠
        proxy_read_timeout 300s;
    }
}
