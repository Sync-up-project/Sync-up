# Sync-up 리버스 프록시 (docker-compose.prod.yml 의 nginx 서비스가 사용)
#
#   /              → 활성 색 frontend (Next.js)
#   /backend/*     → 활성 색 backend (NestJS). 앞의 "/backend" 는 떼고 전달합니다.
#                    REST API, GitHub OAuth, 채팅 소켓(/backend/socket.io) 모두 여기로 갑니다.
#   /_next/static/ → 공유 볼륨의 정적 파일을 nginx 가 직접 서빙
#
# 블루-그린: 어느 색으로 보낼지는 deploy.sh 가 만드는 /etc/nginx/syncup/upstream.conf 가 정합니다.
#   upstream syncup_backend  { server backend-<색>:3000; }
#   upstream syncup_frontend { server frontend-<색>:3000; }
# 색을 바꿀 때는 이 파일만 교체하고 `nginx -s reload` 합니다. reload 는 처리 중인 요청을 끊지 않습니다.
#
# 브라우저 입장에선 프론트/백엔드가 같은 도메인이라 CORS·쿠키 문제가 생기지 않습니다.
# 프론트가 "/backend" 를 쓰는 이유는 frontend/src/lib/backendUrl.ts 참고.
# (Next.js 자체 API 라우트가 /api 를 쓰고 있어서 /api 대신 /backend 를 사용)

include /etc/nginx/syncup/upstream.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Next.js 빌드 산출물(파일 이름에 해시 포함). 각 버전의 frontend 가 시작할 때 공유 볼륨에 복사합니다.
    # 배포 직전에 페이지를 연 사용자가 옛 JS 파일을 요청해도 여기서 찾을 수 있습니다.
    location /_next/static/ {
        alias /var/www/next-static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /backend/ {
        # 끝의 "/" 때문에 /backend/auth/login → backend:3000/auth/login 으로 전달됩니다.
        proxy_pass http://syncup_backend/;

        # socket.io (websocket) 업그레이드
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드 쿠키는 path=/auth, /auth/github 로 발급됩니다.
        # 브라우저가 보는 경로는 /backend/auth/... 이므로 경로를 맞춰 주지 않으면
        # refresh_token 이 전송되지 않아 로그인 유지(토큰 재발급)가 깨집니다.
        proxy_cookie_path /auth /backend/auth;

        # AI 생성 요청은 오래 걸릴 수 있음
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://syncup_frontend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next API 라우트가 AI 생성 요청을 백엔드로 중계하므로 동일하게 여유를 둠
        proxy_read_timeout 300s;
    }
}

# 내부 전용: deploy.sh 가 색 전환 직후 nginx 를 거쳐 새 버전을 확인하는 스모크 테스트용.
# 포트를 외부에 열지 않으며(compose ports 에 없음), 컨테이너 안에서만 접근합니다.
# HTTPS 리다이렉트 설정과 무관하게 동작하도록 80 번 서버와 분리했습니다.
server {
    listen 8081;
    allow 127.0.0.1;
    deny all;

    location = /healthz/backend {
        proxy_pass http://syncup_backend/health;
    }

    location = /healthz/frontend {
        proxy_pass http://syncup_frontend/;
    }
}
