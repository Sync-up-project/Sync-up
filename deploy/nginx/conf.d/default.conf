# Sync-up 리버스 프록시 (docker-compose.prod.yml 의 nginx 서비스가 사용)
#
#   /              → frontend 컨테이너들 (Next.js)
#   /backend/*     → backend 컨테이너들 (NestJS). 앞의 "/backend" 는 떼고 전달합니다.
#                    REST API, GitHub OAuth, 채팅 소켓(/backend/socket.io) 모두 여기로 갑니다.
#   /_next/static/ → 공유 볼륨의 정적 파일을 nginx 가 직접 서빙
#
# docker-rollout: 배포 중에는 같은 서비스 컨테이너가 잠시 2개가 됩니다.
# nginx 가 새 컨테이너를 찾도록 서비스 이름을 Docker 내부 DNS(127.0.0.11)로 매 요청 다시 조회합니다.
# (upstream 블록에 이름을 적으면 nginx 가 시작할 때 한 번만 조회해서 새 컨테이너를 모릅니다)
# proxy_pass 에 변수를 쓰면 조회 결과(컨테이너 여러 개)에 라운드로빈으로 보내고,
# 연결이 실패하면(멈추는 중인 옛 컨테이너 등) 다음 주소로 재시도합니다.
#
# 브라우저 입장에선 프론트/백엔드가 같은 도메인이라 CORS·쿠키 문제가 생기지 않습니다.
# 프론트가 "/backend" 를 쓰는 이유는 frontend/src/lib/backendUrl.ts 참고.
# (Next.js 자체 API 라우트가 /api 를 쓰고 있어서 /api 대신 /backend 를 사용)

resolver 127.0.0.11 valid=1s ipv6=off;
resolver_timeout 2s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    set $backend_upstream  backend:3000;
    set $frontend_upstream frontend:3000;

    # 연결 실패 시 다른 컨테이너로 재시도 (요청을 보내기 전 실패라 POST 도 안전)
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 3s;

    # Next.js 빌드 산출물(파일 이름에 해시 포함). 각 버전의 frontend 가 시작할 때 공유 볼륨에 복사합니다.
    # 배포 직전에 페이지를 연 사용자가 옛 JS 파일을 요청해도 여기서 찾을 수 있습니다.
    location /_next/static/ {
        alias /var/www/next-static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /backend/ {
        # 변수 proxy_pass 는 URI 를 바꿔 주지 않으므로 "/backend" 를 직접 떼어 냅니다.
        # (/backend/auth/login → /auth/login, 쿼리 문자열은 그대로 유지)
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;

        # socket.io (websocket) 업그레이드
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 백엔드 쿠키는 path=/auth, /auth/github 로 발급됩니다.
        # 브라우저가 보는 경로는 /backend/auth/... 이므로 경로를 맞춰 주지 않으면
        # refresh_token 이 전송되지 않아 로그인 유지(토큰 재발급)가 깨집니다.
        proxy_cookie_path /auth /backend/auth;

        # AI 생성 요청은 오래 걸릴 수 있음
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://$frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next API 라우트가 AI 생성 요청을 백엔드로 중계하므로 동일하게 여유를 둠
        proxy_read_timeout 300s;
    }
}

# 내부 전용: deploy.sh 가 배포 직후 nginx 를 거쳐 새 버전을 확인하는 스모크 테스트용.
# 포트를 외부에 열지 않으며(compose ports 에 없음), 컨테이너 안에서만 접근합니다.
# HTTPS 리다이렉트 설정과 무관하게 동작하도록 80 번 서버와 분리했습니다.
server {
    listen 8081;
    allow 127.0.0.1;
    deny all;

    set $backend_upstream  backend:3000;
    set $frontend_upstream frontend:3000;

    location = /healthz/backend {
        proxy_pass http://$backend_upstream/health;
    }

    location = /healthz/frontend {
        proxy_pass http://$frontend_upstream/;
    }
}
